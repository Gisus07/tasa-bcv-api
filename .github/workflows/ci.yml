name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # NOTE: el nombre del job es el "context" que exige la branch protection de
    # main. Aunque ahora también corra lint + format, NO lo renombres sin
    # actualizar la regla de protección, o quedará exigiendo un check inexistente.
    name: typecheck + tests + build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NODE_ENV: test
      TZ: America/Caracas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
